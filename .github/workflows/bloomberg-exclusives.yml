name: Bloomberg Exclusives Watch

on:
  schedule:
    # Every 5 minutes (GitHub's minimum cron granularity). GitHub runs cron on a
    # best-effort basis, so expect drift and the occasional skipped/coalesced slot
    # when the hosted runners are busy — see README's Timing/Caveats sections.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      prime:
        description: 'Reset state to whatever is on /latest right now, without alerting'
        type: boolean
        default: false
      dry_run:
        description: 'Run the scrape but do not post to Slack'
        type: boolean
        default: false

permissions:
  contents: write

# seen_urls.json is committed back to the repo, so two runs must never overlap.
concurrency:
  group: bloomberg-exclusives
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          # patchright and playwright share this registry, so one cache covers both.
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium and Xvfb
        run: |
          # Scrapling's StealthyFetcher drives Chromium through patchright, but its
          # own installer only pulls Playwright's copy. Do both.
          python -m playwright install --with-deps chromium
          python -m patchright install chromium
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Watch for exclusives
        id: watch
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BBG_PROXY: ${{ secrets.BBG_PROXY }}
          BBG_MAX_CHECKS: '25'
          BBG_WORKERS: '3'
        run: |
          # /latest's bot check treats a headful browser far more kindly, so give
          # Chromium a real (virtual) display rather than running it headless.
          xvfb-run -a python bloomberg_watch.py \
            ${{ inputs.prime && '--prime' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit updated state
        if: always() && !inputs.dry_run
        run: |
          if [ -z "$(git status --porcelain -- seen_urls.json)" ]; then
            echo "seen_urls.json unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json
          git commit -m "chore: bloomberg watcher state ($(date -u +%Y-%m-%dT%H:%MZ))"
          # A neighbouring run may have landed while this one was scraping.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::warning::could not push state; the next run will re-check these URLs"
          exit 1

      - name: Tell Slack the run itself broke
        # The script posts its own Slack alert when the scrape fails, and sets
        # `alerted` when it does. This step covers everything else: dependency
        # installs, the 25-minute timeout, a failed state push.
        if: failure() && steps.watch.outputs.alerted != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"warning: Bloomberg Exclusives Watch failed - <$RUN_URL|view the run log>\"}" \
            "$SLACK_WEBHOOK_URL"
